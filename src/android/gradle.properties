org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# [perf 2026-11-19] Rebuilds of this single-module app are dominated by a
# full Kotlin pass; these cut the cost of everything around it:
# - caching: task outputs are reused across clean rebuilds and branch swaps
#   (the app has one module, so up-to-date checks alone rarely save much).
# - configuration-cache: a build of this script graph takes seconds every
#   invocation; plugins are AGP 8.7 / Kotlin 2.1, both supported. `problems=warn`
#   keeps an unsupported corner non-fatal while it is being validated.
# - parallel: the packaging chain (assets / resources / art profile / manifest)
#   is a handful of independent tasks that used to run one after another.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.parallel=true

kotlin.daemon.jvmargs=-Xmx6144m
